version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A dependency joins the first group it matches, so the React/3D group
    # comes first: those packages must move together, and three's 0.x
    # releases count as "minor" bumps even when they break things.
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@react-three/*'
          - '@react-spring/*'
          - three
      # One PR a week for everything that should not break anything.
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
