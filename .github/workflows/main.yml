name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

# Jobs ask for their own permissions, so PR builds stay read-only.
permissions: {}

# Pushes share one queue, build included, so deploys can't overlap or land out of
# order. PRs queue per ref so they can't displace a pending deploy.
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # Version comes from packageManager in package.json

      - name: Create env file
        run: |
          echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}" >> .env
          echo "VITE_GOOGLE_MAPS_MAP_ID=${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}" >> .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      # Maps and audio hosts are blocked in these tests, so no key is used or billed.
      - name: End-to-end tests
        run: pnpm run test:e2e

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
