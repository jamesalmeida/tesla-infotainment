name: Checks

on:
  push:
    branches:
      - main
  pull_request:

# Jobs ask for their own permissions, so PR builds stay read-only.
permissions: {}

# A newer run on the same branch supersedes an older one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # Version comes from packageManager in package.json

      - name: Create env file
        run: |
          echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}" >> .env
          echo "VITE_GOOGLE_MAPS_MAP_ID=${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}" >> .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # The browser suite is slow on a runner without a GPU. It runs on pull requests,
      # where a change is checked before merge, not on every push to main.
      - name: Install browser
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium

      # Maps and audio hosts are blocked in these tests, so no key is used or billed.
      - name: End-to-end tests
        if: github.event_name == 'pull_request'
        run: pnpm run test:e2e
